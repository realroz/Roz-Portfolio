# Copy this file into the certs/ directory on the server, next to
# fullchain.pem and privkey.pem:
#
#   cp deploy/tls.conf certs/tls.conf
#
# nginx.conf includes /etc/nginx/certs/*.conf, so this activates the TLS
# listener only where the certificates are actually present.

server {
    listen 3443 ssl;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    server_name resume.rozinak.us www.resume.rozinak.us;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
