events {
    worker_connections 1024;
}

http {
    # Additional configurations like MIME types, logging, and others
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Plain HTTP. TLS is handled by the optional server block below.
    server {
        listen 8089;

        server_name resume.rozinak.us www.resume.rozinak.us;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }

    # The TLS listener on 3443 lives in tls.conf alongside the certificates,
    # which are mounted from ./certs at runtime. Where that directory has no
    # tls.conf (a dev machine without certs), this glob matches nothing and
    # the container serves plain HTTP only.
    include /etc/nginx/certs/*.conf;
}
